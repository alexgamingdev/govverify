<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GovVerify Demo</title>
    <style>
      :root {
        --bg-a: #e8f4ff;
        --bg-b: #f6f8ff;
        --ink: #122034;
        --muted: #4f627d;
        --card: rgba(255, 255, 255, 0.82);
        --line: rgba(15, 32, 52, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 10%, var(--bg-a), var(--bg-b));
        font: 16px/1.5 "Trebuchet MS", "Segoe UI", sans-serif;
        color: var(--ink);
      }

      main {
        width: min(760px, 92vw);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 18px 44px rgba(11, 31, 51, 0.14);
        padding: 32px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 4.4vw, 2.8rem);
      }

      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GovVerify</h1>
      <p>Diese Einzelseite dient als minimaler Release-Demo-Ordner mit genau einer Webseite.</p>
    </main>
  </body>
</html>
